<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* Set the background image for the body */
        body {
            background-image: url('calci1.jpeg'); /* Replace with your image URL */
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Calculator container box styling */
        .calculator-container {
            background-color: rgba(191, 192, 152, 0.85); /* Light color for calculator box */
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(187, 218, 125, 0.2);
            width: 400px;
            border: 2px solid #6d8a3a; /* Border color for calculator box */
        }

        /* Center title and reduce spacing with box styling */
        .calculator-title {
            text-align: center;
            background-color: #d0eab1; /* Background color for the title box */
            color: rgb(0, 0, 0); /* Text color */
            border-color: #f3eeee;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 24px;
        }

        /* Input field styling */
        .short-input {
            width: 100%; /* Full width for better user experience */
            margin-bottom: 20px;
            background-color: #e1decc; /* Light background for inputs */
            border: 1px solid #e1decc; /* Border for inputs */
        }

        /* Styling for the result input field */
        .form-control[readonly] {
            background-color: #e1decc; /* Slightly darker color for result */
        }

        /* Button styling */
        .btn {
            width: 100%;
            margin-bottom: 10px;
            font-weight: bold;
            padding: 10px;
        }

        /* Specific button color adjustments */
        .btn-primary {
            background-color: #acb97d;
            border-color: #000000;
        }
        .btn-secondary {
            background-color: #acb97d;
            border-color: #000000;
        }
        .btn-success {
            background-color: #acb97d;
            border-color: #000000;
        }
        .btn-danger {
            background-color: #acb97d;
            border-color: #000000;
        }
    </style>
</head>
<body>
    <div class="calculator-container">
        <div class="calculator-title">
            Calculator
        </div>

        <!-- Input fields -->
        <div class="mb-3">
            <label for="num1" class="form-label">First number:</label>
            <input type="text" name="1st number" id="num1" class="form-control short-input" placeholder="Enter first number">
        </div>

        <div class="mb-3">
            <label for="num2" class="form-label">Second number:</label>
            <input type="text" name="2nd number" id="num2" class="form-control short-input" placeholder="Enter second number">
        </div>

        <!-- Operation Buttons -->
        <div class="d-grid gap-2">
            <button type="button" id="add" class="btn btn-primary">Addition</button>
            <button type="button" id="subtract" class="btn btn-secondary">Subtraction</button>
            <button type="button" id="multiply" class="btn btn-success">Multiplication</button>
            <button type="button" id="divide" class="btn btn-danger">Division</button>
        </div>

        <!-- Result Field -->
        <div class="mt-3">
            <label for="rs" class="form-label">RESULT</label>
            <input type="text" name="result" id="rs" class="form-control" readonly>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script type='text/javascript'>
        function Calculate(operation) {
            var num1 = parseFloat(document.getElementById("num1").value);
            var num2 = parseFloat(document.getElementById("num2").value);
            var result;

            if (isNaN(num1) || isNaN(num2)) {
                alert("Please enter valid numbers.");
                return;
            }

            switch (operation) {
                case 'add':
                    result = num1 + num2;
                    break;
                case 'subtract':
                    result = num1 - num2;
                    break;
                case 'multiply':
                    result = num1 * num2;
                    break;
                case 'divide':
                    result = num1 / num2;
                    break;
                default:
                    alert("Invalid operation");
                    return;
            }

            document.getElementById("rs").value = result;
        }

        // Add event listeners to buttons
        document.getElementById("add").addEventListener("click", function() { Calculate('add'); });
        document.getElementById("subtract").addEventListener("click", function() { Calculate('subtract'); });
        document.getElementById("multiply").addEventListener("click", function() { Calculate('multiply'); });
        document.getElementById("divide").addEventListener("click", function() { Calculate('divide'); });
    </script>
</body>
</html>
